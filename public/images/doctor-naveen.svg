<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDF6FF"/>
      <stop offset="100%" stop-color="#F1F9E9"/>
    </linearGradient>
    <linearGradient id="coatGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#078EE8"/>
      <stop offset="100%" stop-color="#191F30"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" fill="url(#bgGrad2)"/>
  
  <!-- Subtle Bone / Joint & Plus icon patterns -->
  <g opacity="0.12" fill="#70B82F">
    <rect x="50" y="50" width="8" height="24" rx="2"/>
    <rect x="42" y="58" width="24" height="8" rx="2"/>
    <rect x="330" y="70" width="8" height="24" rx="2"/>
    <rect x="322" y="78" width="24" height="8" rx="2"/>
    <circle cx="65" cy="280" r="8"/>
    <circle cx="335" cy="270" r="8"/>
  </g>

  <!-- Circular Glow -->
  <circle cx="200" cy="180" r="130" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="200" cy="180" r="128" fill="none" stroke="#70B82F" stroke-width="3" stroke-dasharray="8 6" opacity="0.3"/>

  <!-- Doctor Silhouette / Illustration (Orthopaedician & Diabetologist) -->
  <!-- Shoulders & Coat -->
  <path d="M 90 480 C 90 365, 135 325, 200 325 C 265 325, 310 365, 310 480 Z" fill="url(#coatGrad2)" filter="drop-shadow(0px -4px 10px rgba(0,0,0,0.06))"/>
  
  <!-- Shirt & Tie -->
  <polygon points="175,325 225,325 200,380" fill="#FFFFFF"/>
  <polygon points="194,335 206,335 204,410 196,410" fill="url(#tieGrad)"/>

  <!-- Stethoscope -->
  <path d="M 160 325 C 160 415, 175 435, 200 435 C 225 435, 240 415, 240 325" fill="none" stroke="#191F30" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="440" r="12" fill="#078EE8" stroke="#191F30" stroke-width="4"/>

  <!-- Neck & Face -->
  <rect x="180" y="240" width="40" height="95" rx="20" fill="#E8B896"/>
  <ellipse cx="200" cy="195" rx="55" ry="65" fill="#EFBE9B"/>
  
  <!-- Male Short Professional Hair -->
  <path d="M 142 185 C 142 120, 170 110, 200 110 C 230 110, 258 120, 258 185 C 250 160, 240 140, 200 140 C 160 140, 150 160, 142 185 Z" fill="#231F20"/>

  <!-- Friendly eyes & confident expression -->
  <path d="M 172 185 Q 182 182 192 185" fill="none" stroke="#231F20" stroke-width="3" stroke-linecap="round"/>
  <path d="M 208 185 Q 218 182 228 185" fill="none" stroke="#231F20" stroke-width="3" stroke-linecap="round"/>
  <path d="M 188 225 Q 200 236 212 225" fill="none" stroke="#248447" stroke-width="3" stroke-linecap="round"/>

  <!-- Specialty Badge -->
  <g transform="translate(200, 435)">
    <rect x="-140" y="-15" width="280" height="42" rx="21" fill="#191F30" stroke="#70B82F" stroke-width="2"/>
    <text x="0" y="12" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">
      ORTHOPAEDICIAN &amp; DIABETOLOGIST
    </text>
  </g>
</svg>
