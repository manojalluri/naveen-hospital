<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDF6FF"/>
      <stop offset="70%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F9E9"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#078EE8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#191F30" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="pinkAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F0005B"/>
      <stop offset="100%" stop-color="#D90050"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- Sun / Soft warmth glow -->
  <circle cx="680" cy="140" r="80" fill="#FF970F" opacity="0.15"/>

  <!-- Modern Hospital Facade -->
  <!-- Main central block -->
  <rect x="220" y="160" width="360" height="380" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Architectural Pink Canopy & Band -->
  <rect x="210" y="210" width="380" height="14" fill="url(#pinkAccent)" rx="4"/>
  <rect x="210" y="320" width="380" height="10" fill="#70B82F" rx="3"/>

  <!-- Left Emergency & Diagnostics Wing -->
  <rect x="90" y="240" width="150" height="300" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Right Pediatric & Inpatient Wing -->
  <rect x="560" y="240" width="150" height="300" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Hospital Brand Header Panel -->
  <rect x="250" y="110" width="300" height="58" rx="8" fill="#191F30"/>
  <text x="400" y="138" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="800" fill="#F0005B" letter-spacing="2">NAVEEN</text>
  <text x="400" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">MULTI-SPECIALITY HOSPITAL</text>

  <!-- Large Glass Windows Matrix -->
  <!-- Left Wing Windows -->
  <g fill="url(#glassGrad)" opacity="0.8">
    <rect x="115" y="270" width="45" height="40" rx="4"/>
    <rect x="175" y="270" width="45" height="40" rx="4"/>
    <rect x="115" y="330" width="45" height="40" rx="4"/>
    <rect x="175" y="330" width="45" height="40" rx="4"/>
    <rect x="115" y="390" width="45" height="40" rx="4"/>
    <rect x="175" y="390" width="45" height="40" rx="4"/>
  </g>

  <!-- Central Windows -->
  <g fill="url(#glassGrad)" opacity="0.85">
    <rect x="250" y="240" width="65" height="60" rx="5"/>
    <rect x="330" y="240" width="65" height="60" rx="5"/>
    <rect x="410" y="240" width="65" height="60" rx="5"/>
    <rect x="490" y="240" width="65" height="60" rx="5"/>

    <rect x="250" y="350" width="65" height="55" rx="5"/>
    <rect x="330" y="350" width="65" height="55" rx="5"/>
    <rect x="410" y="350" width="65" height="55" rx="5"/>
    <rect x="490" y="350" width="65" height="55" rx="5"/>
  </g>

  <!-- Right Wing Windows -->
  <g fill="url(#glassGrad)" opacity="0.8">
    <rect x="580" y="270" width="45" height="40" rx="4"/>
    <rect x="640" y="270" width="45" height="40" rx="4"/>
    <rect x="580" y="330" width="45" height="40" rx="4"/>
    <rect x="640" y="330" width="45" height="40" rx="4"/>
    <rect x="580" y="390" width="45" height="40" rx="4"/>
    <rect x="640" y="390" width="45" height="40" rx="4"/>
  </g>

  <!-- Emergency 24/7 Signage on Left -->
  <rect x="105" y="470" width="120" height="40" rx="6" fill="#F0005B"/>
  <text x="165" y="495" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">24/7 EMERGENCY</text>

  <!-- Main Entrance -->
  <rect x="340" y="450" width="120" height="90" rx="6" fill="#191F30"/>
  <!-- Automatic Glass Sliding Doors -->
  <rect x="350" y="465" width="46" height="75" fill="#EDF6FF" opacity="0.9"/>
  <rect x="404" y="465" width="46" height="75" fill="#EDF6FF" opacity="0.9"/>

  <!-- Hospital Ground / Landscaping -->
  <rect x="0" y="540" width="800" height="60" fill="#E2E8F0"/>
  <path d="M 0 550 Q 400 535 800 550 L 800 600 L 0 600 Z" fill="#70B82F" opacity="0.25"/>

  <!-- Modern Ambulance bay indication -->
  <g transform="translate(600, 485)">
    <rect x="0" y="0" width="85" height="45" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="0" y="22" width="85" height="6" fill="#F0005B"/>
    <circle cx="20" cy="46" r="10" fill="#191F30"/>
    <circle cx="65" cy="46" r="10" fill="#191F30"/>
    <rect x="36" y="8" width="12" height="12" fill="#70B82F"/>
    <rect x="55" y="6" width="22" height="14" fill="#078EE8" opacity="0.5"/>
  </g>
</svg>
